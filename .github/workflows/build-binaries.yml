name: Build Binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.12.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "release_tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-8)"
            TAG="pi-studio-prerelease-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
            echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.meta.outputs.checkout_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: 1.2.20

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Build binaries
        run: ./scripts/build-binaries.sh

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.meta.outputs.release_tag }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix

          if [ "${{ steps.meta.outputs.is_prerelease }}" = "true" ]; then
            cat <<'EOF' > /tmp/release-notes.md
PI Studio prerelease for Windows testing.

Included artifacts:

- CLI: `pi-windows-x64.exe` and `pi-windows-x64.zip`
- Desktop shell track (if present): `pi-studio-desktop-windows-x64.exe` and `pi-studio-desktop-windows-x64.zip`

SmartScreen notice:

- These prerelease binaries are currently unsigned and may trigger a Windows SmartScreen warning.
- Choose "More info" then "Run anyway" only if you trust this repository and release.

Pre-release checklist:

- [ ] Single-agent prompt flow
- [ ] Sequential flow with route edits
- [ ] Local provider setup
- [ ] Plugin/skill toggle checks
EOF
          else
            # Extract changelog section for tagged releases
            cd packages/coding-agent
            awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > /tmp/release-notes.md

            # If empty, use a default message
            if [ ! -s /tmp/release-notes.md ]; then
              echo "Release ${VERSION}" > /tmp/release-notes.md
            fi
          fi

      - name: Collect release assets
        id: assets
        run: |
          cd packages/coding-agent/binaries
          assets=()
          for file in \
            pi-darwin-arm64.tar.gz \
            pi-darwin-x64.tar.gz \
            pi-linux-x64.tar.gz \
            pi-linux-arm64.tar.gz \
            pi-windows-x64.zip \
            pi-windows-x64.exe \
            pi-studio-desktop-windows-x64.zip \
            pi-studio-desktop-windows-x64.exe; do
            if [ -f "$file" ]; then
              assets+=("$file")
            fi
          done
          printf "asset_list=%s\n" "${assets[*]}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd packages/coding-agent/binaries
          ASSETS="${{ steps.assets.outputs.asset_list }}"
          if [ -z "$ASSETS" ]; then
            echo "No release assets found."
            exit 1
          fi

          PRERELEASE_FLAG=""
          if [ "${{ steps.meta.outputs.is_prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Create release with changelog notes (or update if exists)
          gh release create "${{ steps.meta.outputs.release_tag }}" \
            --title "${{ steps.meta.outputs.release_tag }}" \
            $PRERELEASE_FLAG \
            --notes-file /tmp/release-notes.md \
            $ASSETS \
            2>/dev/null || \
          gh release upload "${{ steps.meta.outputs.release_tag }}" \
            $ASSETS \
            --clobber
